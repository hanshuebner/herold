name: auto-rerun on runner shutdown

# Detect ci runs that failed because the self-hosted runner was
# restarted mid-job (peers see this as transient noise that breaks
# main / feature branch CI without any real test regression) and
# automatically re-run the failed jobs. Only triggers on the ci
# workflow's "completed" event, only scans jobs that ended in
# `failure`, and only acts when the job log contains the marker line
#
#     The runner has received a shutdown signal
#
# emitted by actions/runner when its service stops mid-step. Other
# failure modes are left untouched so genuine test regressions still
# block the run.
#
# Loop guard: the run_attempt is capped at 3. If the same shutdown
# pattern fires four times in a row, manual intervention is needed
# anyway (the runner is broken, not just restarting).

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun-on-shutdown:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 4 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: scan failed jobs for runner-shutdown marker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='The runner has received a shutdown signal'
          shutdown=0
          # Fetch ids of every job that failed in this run. A workflow
          # run with multiple failed jobs may mix shutdown-killed jobs
          # with genuine failures; we only want to rerun if EVERY
          # failure was shutdown-caused (rerunning otherwise hides
          # real regressions).
          failed_ids=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
            --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | .id')
          if [ -z "${failed_ids}" ]; then
            echo "no failed jobs to inspect"
            exit 0
          fi
          all_shutdown=1
          for jid in ${failed_ids}; do
            echo "inspecting job ${jid}"
            if gh api "repos/${REPO}/actions/jobs/${jid}/logs" 2>/dev/null \
                 | grep -F -q "${marker}"; then
              echo "  job ${jid}: runner-shutdown marker present"
              shutdown=$((shutdown + 1))
            else
              echo "  job ${jid}: no runner-shutdown marker - real failure"
              all_shutdown=0
            fi
          done
          if [ "${shutdown}" -eq 0 ]; then
            echo "no shutdown-caused failures; nothing to rerun"
            exit 0
          fi
          if [ "${all_shutdown}" -ne 1 ]; then
            echo "mixed failures: some jobs failed for non-shutdown reasons; skipping auto-rerun"
            exit 0
          fi
          echo "all ${shutdown} failed jobs were shutdown-caused; triggering rerun-failed-jobs"
          gh api -X POST "repos/${REPO}/actions/runs/${RUN_ID}/rerun-failed-jobs"
