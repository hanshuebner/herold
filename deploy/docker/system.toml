# Herold - container-internal default config.
#
# Baked into the image at /etc/herold/system.toml. Used by the
# `docker run` quickstart so the container runs end-to-end without any
# external file mounts.
#
# All listeners run plaintext on loopback (tls = "none"). This is
# honest for a no-DNS local evaluation: no self-signed certificate is
# baked into the image, so no mail client is ever shown a certificate
# warning to click through. The HTTP listeners were already plaintext;
# the mail listeners now are too.
#
# For a real deployment, override /etc/herold/system.toml with a bind
# mount. Use [acme] for automatic certificate management, or set
# tls = "starttls" / tls = "implicit" with cert_file / key_file on
# each listener. See docs/manual/admin/going-live.mdoc (DNS, ACME,
# DKIM, DMARC, MTA-STS).

[server]
hostname = "mail.example.local"
data_dir = "/var/lib/herold"
shutdown_grace = "30s"

[server.admin_tls]
source = "none"

[server.storage]
backend = "sqlite"

[server.storage.sqlite]
path = "/var/lib/herold/herold.sqlite"

# Listeners bind 0.0.0.0 inside the container so the port forwarding
# Docker sets up with `-p 127.0.0.1:HOST:CONTAINER` reaches them. The
# *host*-side bind picked by `docker run -p 127.0.0.1:...` is what
# constrains the surface to loopback; inside the container the listener
# must accept the forwarded connection.

[[listener]]
name = "smtp-relay"
address = "0.0.0.0:1025"
protocol = "smtp"
tls = "none"

[[listener]]
name = "smtp-submission"
address = "0.0.0.0:1587"
protocol = "smtp-submission"
tls = "none"
auth_required = true
# Submission must accept SASL PLAIN / LOGIN over the loopback hop --
# this listener is reachable only from the host's 127.0.0.1 via the
# Docker port forward, so cleartext auth is the documented loopback
# posture (issue #114).
allow_plain_auth = true

[[listener]]
name = "imap"
address = "0.0.0.0:1143"
protocol = "imap"
tls = "none"
# Same rationale as smtp-submission above: IMAP LOGIN over the
# loopback hop is the documented quickstart auth path (issue #114).
allow_plain_auth = true

[[listener]]
name = "public"
address = "0.0.0.0:8080"
protocol = "http"
kind = "public"
tls = "none"

[[listener]]
name = "admin"
address = "0.0.0.0:9443"
protocol = "http"
kind = "admin"
tls = "none"

[server.suite]
# Use the binary-embedded SPA artefacts (baked in by the Dockerfile).
enabled = true

[observability]
log_format = "json"
log_level = "info"
metrics_bind = "0.0.0.0:9090"

# Client-log ingest (REQ-OPS-219). telemetry_enabled = true is the
# recommended quickstart default (REQ-OPS-208): operators that want
# to opt out of per-user behavioural telemetry set this to false.
[clientlog]
enabled = true

[clientlog.defaults]
telemetry_enabled = true
