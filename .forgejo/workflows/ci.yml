name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Aligned with go.mod's `go 1.26.4` directive. Several direct deps
  # (golang.org/x/sync, golang.org/x/crypto, golang.org/x/oauth2,
  # github.com/coreos/go-oidc/v3, github.com/jackc/pgx/v5, the
  # otel/otlptrace exporters) already require Go 1.26 at module level,
  # so the CI floor must match. Per STANDARDS the floor moves with the
  # current stable.
  GO_VERSION: "1.26.4"
  # Node + pnpm versions for the web/ workspace. Node 20 LTS is the floor.
  NODE_VERSION: "20"
  PNPM_VERSION: "10"

jobs:
  # pre-commit job runs the full .pre-commit-config.yaml chain across all
  # files. Keeps .pre-commit-config.yaml and the rest of CI in lockstep:
  # any check available locally is enforced here, so `make install-hooks`
  # contributors see exactly what CI sees.
  pre-commit:
    name: pre-commit (run --all-files)
    runs-on: [self-hosted, netzhansa, amd64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: install Go tools used by pre-commit hooks
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # The bake snapshot ships pre-commit at /usr/local/bin/pre-commit
      # (set up by the runner-bakery provision.sh in netzhansa-infra, in
      # an isolated venv at /opt/pre-commit), plus python3.12, pip, and
      # node + pnpm. The
      # earlier apt-install workaround was needed only when the
      # runner ran jobs inside a node:22-bookworm container; with the
      # host-mode runner labels (see cmd/herold-runner-orchestrator/
      # cloud_init.go) those tools are now directly visible.
      # The svelte-check pre-commit hook runs `pnpm --dir web run check`,
      # so pre-commit needs Node + pnpm on PATH and the workspace
      # dependencies installed.
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm install (workspace)
        run: pnpm --dir web install --frozen-lockfile
      - name: prep web placeholders
        run: make prep-web
      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure --color always

  lint:
    name: lint
    runs-on: [self-hosted, netzhansa, amd64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # go vet / staticcheck / govulncheck must compile the tree, which
      # means internal/webspa/embed_default.go's `//go:embed dist` has
      # to resolve. prep-web copies the tracked placeholders into
      # internal/webspa/dist/ when the directory is empty.
      - name: prep web placeholders
        run: make prep-web
      - name: gofmt
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "gofmt needs to be run on:"; echo "$diff"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1.3.1
        with:
          version: latest
          install-go: false
      - name: govulncheck
        uses: golang/govulncheck-action@v1.0.4
        with:
          go-version-input: ${{ env.GO_VERSION }}
          go-package: ./...

  # x86_64 confidence lane: catches ARM-only drift before users do.
  # Pure-Go correctness bugs surface on ARM (weaker memory order), so
  # this lane is for "is the world still sane on the platform 95% of
  # operators run". Hard-fail blocks merge.
  confidence-x86:
    name: confidence (x86_64 sanity smoke)
    runs-on: [self-hosted, netzhansa, amd64]
    timeout-minutes: 10
    # No `services:` block: act_runner host-mode does not start
    # workflow service containers (confirmed in run #21: no
    # `docker create image=postgres:16` shows up in the log, and
    # the wait-for-postgres step then times out). The runner VMs
    # all have docker installed (the bake snapshot), so we launch
    # postgres ourselves in a step and `localhost:5432` is reachable
    # via the published port. The VM is ephemeral and reaped after
    # the job, so we don't bother with explicit teardown.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: prep web placeholders
        run: make prep-web
      - name: build (default + nofrontend)
        run: |
          go build -trimpath ./...
          go build -trimpath -tags nofrontend ./...
      - name: vet
        run: go vet ./...
      - name: parser tests (high non-arch-related signal density)
        run: |
          go test -count=1 -timeout 5m \
            ./internal/maildkim/... ./internal/mailspf/... \
            ./internal/maildmarc/... ./internal/mailarc/... \
            ./internal/sieve/... ./internal/protosmtp/... \
            ./internal/protoimap/... ./internal/protojmap/...
      - name: storage smoke (sqlite migrations + round-trip)
        env:
          HEROLD_TEST_STORE: sqlite
        run: go test -count=1 -timeout 3m ./internal/diag/migrate/...
      - name: start postgres (manual, act_runner host-mode ignores services:)
        run: |
          # vm_max_lifetime=120m means the same runner serves multiple
          # jobs back-to-back; a stale `postgres` container from an
          # earlier job collides on the name. Remove unconditionally
          # before starting; the new container --rm's itself when we
          # stop it in the cleanup step.
          docker rm -f postgres 2>/dev/null || true
          docker run -d --name postgres --rm \
            -p 5432:5432 \
            -e POSTGRES_USER=herold \
            -e POSTGRES_PASSWORD=herold \
            -e POSTGRES_DB=herold \
            --health-cmd pg_isready \
            --health-interval=5s --health-timeout=5s --health-retries=10 \
            postgres:16
      - name: wait for postgres
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/localhost/5432) 2>/dev/null; then
              exec 3>&-; echo "postgres ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "postgres not ready after 30s" >&2
          docker logs postgres 2>&1 | tail -40 >&2 || true
          exit 1
      - name: postgres smoke + e2e happy path
        env:
          HEROLD_PG_DSN: postgres://herold:herold@localhost:5432/herold?sslmode=disable
        run: |
          go test -count=1 -timeout 5m -p 1 \
            ./internal/storepg/... ./internal/diag/migrate/... ./test/e2e/...
      - name: stop postgres
        if: always()
        run: docker rm -f postgres 2>/dev/null || true

  web:
    name: web (build + check)
    runs-on: [self-hosted, netzhansa, amd64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm install (workspace)
        run: pnpm --dir web install --frozen-lockfile
      - name: build (suite SPA)
        run: pnpm --dir web run build
      - name: check (svelte-check etc)
        run: pnpm --dir web run check
      # `test` and `lint` are no-ops today (no package defines them);
      # `pnpm --recursive --if-present` keeps that future-proof.
      - name: test
        run: pnpm --dir web run test
      - name: lint
        run: pnpm --dir web run lint

  web-e2e:
    name: web-e2e (admin SPA Playwright)
    runs-on: [self-hosted, netzhansa, amd64]
    timeout-minutes: 15
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm install (workspace)
        run: pnpm --dir web install --frozen-lockfile
      # The ephemeral runner VM boots with unattended-upgrades and the
      # apt-daily timers running, so Playwright's `install --with-deps`
      # (apt-get under the hood) exits 100 ("Could not get lock ...") when it
      # races them for the dpkg/apt lock. Make apt itself wait for the lock
      # instead of failing: a global DPkg::Lock::Timeout applies to every
      # apt-get, including the one Playwright spawns. Masking the periodic
      # apt units stops fresh apt-get processes from being launched mid-job
      # (a stop+wait alone is racy -- a timer relaunches apt-get right after
      # the lock clears).
      - name: make apt wait for the dpkg lock
        run: |
          echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/99lock-timeout >/dev/null
          sudo systemctl mask --now \
            unattended-upgrades.service apt-daily.service apt-daily-upgrade.service \
            apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo systemctl kill --kill-who=all unattended-upgrades.service 2>/dev/null || true
      - name: install Playwright browsers (chromium only)
        run: pnpm --filter @herold/admin test:e2e:install
      - name: run admin e2e tests (chromium)
        run: pnpm --filter @herold/admin test:e2e

  test:
    name: test (arm64 / ${{ matrix.store }})
    runs-on: [self-hosted, netzhansa, amd64]
    # 45 min: the sqlite lane historically ran the entire tree under
    # -race and hit ~37 min wall on the arm64 self-hosted runner. The
    # lane is now split into a race-on subset (test/race-packages.txt)
    # and a no-race remainder so the detector cost is paid only on
    # concurrency-heavy packages. The arm64 runner pool was also
    # bumped from cax21 (4 vCPU) to cax31 (8 vCPU) to halve the
    # detector wall time; the 45 min cap is left in place as
    # headroom for the worst-case package.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        store: [sqlite, postgres]
    # No `services:` block: act_runner host-mode does not start
    # workflow service containers. Postgres is launched manually
    # in a per-matrix step below (sqlite lane skips it). See the
    # confidence-x86 job for the same pattern + rationale.
    env:
      HEROLD_TEST_STORE: ${{ matrix.store }}
      # HEROLD_PG_DSN set per-step on the postgres lane only -- exporting
      # it on the sqlite lane caused test/e2e and storepg/diag-migrate
      # to also exercise the postgres path against the leg's service
      # container, duplicating coverage.
      HEROLD_PG_DSN_VALUE: postgres://herold:herold@localhost:5432/herold?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      # setup-go's built-in cache (cache: true, the default) keys on
      # `go.sum` + OS/arch/go-version only -- the `matrix.store` value
      # is NOT in the key. Both lanes (sqlite, postgres) therefore
      # resolve to the same cache entry. Run #17's postgres lane
      # hung on `tar -cf cache.tgz` mid-cache-save while sqlite was
      # the parallel lane still finishing, which lines up with the
      # two saves racing on the same key. Disable the built-in cache
      # here and use an explicit actions/cache@v4 step below with
      # matrix.store mixed into the key so the lanes don't fight.
      # Other jobs (lint, confidence-x86, fuzz, conformance) keep
      # the built-in cache because they don't run concurrently with
      # a sibling that targets the same key.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: cache go module + build cache (per matrix.store)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ matrix.store }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ matrix.store }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-
      # Build with the default tag (which embeds the SPA placeholders
      # via go:embed) and a second pass with -tags nofrontend so the
      # build-tag split cannot regress without CI catching it.
      - name: prep web placeholders
        run: make prep-web
      - name: build (embedded)
        run: go build -trimpath ./...
      - name: build (nofrontend)
        run: go build -trimpath -tags nofrontend ./...
      - name: start postgres (postgres matrix lane only)
        if: matrix.store == 'postgres'
        run: |
          # vm_max_lifetime=120m means the same runner serves multiple
          # jobs back-to-back; a stale `postgres` container from an
          # earlier job collides on the name.
          docker rm -f postgres 2>/dev/null || true
          docker run -d --name postgres --rm \
            -p 5432:5432 \
            -e POSTGRES_USER=herold \
            -e POSTGRES_PASSWORD=herold \
            -e POSTGRES_DB=herold \
            --health-cmd pg_isready \
            --health-interval=5s --health-timeout=5s --health-retries=10 \
            postgres:16
      - name: wait for postgres
        if: matrix.store == 'postgres'
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/localhost/5432) 2>/dev/null; then
              exec 3>&-; echo "postgres ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "postgres not ready after 30s" >&2
          docker logs postgres 2>&1 | tail -40 >&2 || true
          exit 1
      - name: compute sqlite race / fast package lists
        if: matrix.store == 'sqlite'
        run: |
          set -euo pipefail
          PATTERNS=$(grep -v '^[[:space:]]*#' test/race-packages.txt \
            | grep -v '^[[:space:]]*$' \
            | sed 's|^|./|')
          RACE=$(echo "$PATTERNS" | xargs -r go list 2>/dev/null | sort -u)
          if [ -z "$RACE" ]; then
            echo "race lane: race-packages.txt produced no packages" >&2
            exit 1
          fi
          ALL=$(go list ./... | sort -u)
          NORACE=$(comm -23 <(echo "$ALL") <(echo "$RACE"))
          printf '%s\n' "$RACE"   > /tmp/race-pkgs.txt
          printf '%s\n' "$NORACE" > /tmp/norace-pkgs.txt
          echo "race lane: $(wc -l </tmp/race-pkgs.txt | tr -d ' ') packages"
          echo "fast lane: $(wc -l </tmp/norace-pkgs.txt | tr -d ' ') packages"
      - name: test (sqlite lane, race subset)
        if: matrix.store == 'sqlite'
        run: |
          set -euo pipefail
          PKGS=$(tr '\n' ' ' </tmp/race-pkgs.txt)
          go test -race -count=1 -timeout 30m $PKGS
      - name: test (sqlite lane, fast subset)
        if: matrix.store == 'sqlite'
        run: |
          set -euo pipefail
          PKGS=$(tr '\n' ' ' </tmp/norace-pkgs.txt)
          go test -count=1 -timeout 15m $PKGS
      - name: test (postgres lane, pg-touching packages serialised)
        if: matrix.store == 'postgres'
        env:
          HEROLD_PG_DSN: ${{ env.HEROLD_PG_DSN_VALUE }}
        run: go test -count=1 -timeout 20m -p 1 ./internal/storepg/... ./internal/diag/migrate/... ./test/e2e/...
      - name: test (postgres lane, rest in parallel)
        if: matrix.store == 'postgres'
        run: |
          PKGS=$(go list ./... | grep -vE '^github.com/hanshuebner/herold/(internal/storepg|internal/diag/migrate|test/e2e)($|/)')
          go test -count=1 -timeout 20m $PKGS
      - name: stop postgres
        if: always() && matrix.store == 'postgres'
        run: docker rm -f postgres 2>/dev/null || true

  fuzz-short:
    name: fuzz (short)
    runs-on: [self-hosted, netzhansa, amd64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: run short fuzz on every fuzz target touched in this PR
        # 32 fuzz targets must finish inside the 15-minute job timeout.
        # 5s/target leaves headroom for per-target Go-compile overhead.
        run: make fuzz-short FUZZTIME=5s

  conformance:
    name: conformance (imaptest + scripted-smtp + pigeonhole + mail-auth vectors)
    runs-on: [self-hosted, netzhansa, amd64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # The Go conformance package under test/interop/scripted runs an
      # in-process scripted SMTP corpus and Dovecot's imaptest when its
      # binary is on PATH. The Python/Docker interop tree is exercised
      # by the nightly interop job.
      - name: run conformance
        run: go test -count=1 ./test/interop/...

  docker:
    name: docker (build + publish to code.netzhansa.com registry)
    runs-on: [self-hosted, netzhansa, amd64]
    timeout-minutes: 30
    needs: [lint, web, test]
    # On PRs we build both platforms (linux/amd64 and linux/arm64) without
    # pushing so that a broken amd64 leg fails CI before it reaches the
    # registry. On pushes to main and on git tags we additionally push a
    # multi-arch manifest to the code.netzhansa.com container registry so
    # both amd64 and arm64 operators can `docker pull` the same tag.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # docker-container driver is required for multi-platform builds that
      # produce a manifest list. The default docker driver supports only a
      # single platform at a time when using --load.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      # Forgejo's container registry rejected the auto-injected
      # GITHUB_TOKEN in run #22 with 401 Unauthorized (the token does
      # not currently carry write:package scope even when the
      # workflow declares `permissions: packages: write`). Use a
      # dedicated REGISTRY_TOKEN secret holding a Forgejo PAT with
      # write:package. The login step skips cleanly when the secret
      # isn't set so a fresh fork still gets a green CI on the
      # build-only path.
      - name: log in to code.netzhansa.com registry
        if: github.event_name != 'pull_request' && env.REGISTRY_TOKEN != ''
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        uses: docker/login-action@v3
        with:
          registry: code.netzhansa.com
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: derive image tags
        id: tags
        run: |
          # Lower-case the image owner because OCI registries reject
          # uppercase repository segments and github.repository preserves
          # the case the user typed.
          repo="${GITHUB_REPOSITORY,,}"
          image="code.netzhansa.com/${repo}"
          tags="${image}:sha-${GITHUB_SHA::12}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags},${image}:main,${image}:latest"
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/}"
            tags="${tags},${image}:${ver},${image}:latest"
          fi
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
      # Step 1: build the native image for THIS runner's arch (amd64; see
      # the [self-hosted, netzhansa, amd64] label above) and load it into
      # the local daemon so the smoke-test runs it natively, with no
      # runtime QEMU. `load: true` only works for a single platform, so
      # we build the host arch here and build the full multi-arch image
      # (with push) separately below.
      #
      # The Dockerfile pins web-build/build stages to $BUILDPLATFORM so
      # esbuild and Go run natively, and the Go stage cross-compiles via
      # GOOS/GOARCH, so the multi-arch push step below needs no QEMU even
      # for the arm64 leg.
      - name: build native image (load for smoke-test)
        id: build-native
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
      - name: smoke-test the native image
        run: |
          first_tag=$(echo "${{ steps.tags.outputs.tags }}" | cut -d, -f1)
          echo "smoke-test: using local image ${first_tag}"
          ./scripts/smoke-docker.sh "${first_tag}"
      # Step 2a (push path): build both platforms and push the multi-arch
      # manifest list to the registry. Buildx reuses the cached amd64
      # layers from the native build above (Step 1). Runs only after
      # smoke passes and only when the REGISTRY_TOKEN secret is available.
      - name: build + push multi-arch image (linux/amd64 + linux/arm64)
        if: github.event_name != 'pull_request' && env.REGISTRY_TOKEN != ''
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          load: false
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
      # Step 2b (PR path): build both platforms without pushing so a
      # broken amd64 cross-compilation fails CI before it reaches the
      # registry. No load (multi-platform + load is unsupported), but
      # the build itself exercises the full Dockerfile for both arches.
      - name: build multi-arch image (PR validation, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          load: false
          push: false
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
      - name: warn if REGISTRY_TOKEN is missing
        if: github.event_name != 'pull_request' && env.REGISTRY_TOKEN == ''
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "::warning ::REGISTRY_TOKEN secret is unset; built image was \
            not pushed to code.netzhansa.com. Create a Forgejo PAT with \
            write:package and add it as a repo Actions secret." >&2

  jmaptest:
    name: jmap conformance (jmapio/jmap-test-suite)
    runs-on: [self-hosted, netzhansa, amd64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: run jmaptest harness
        run: make interop-jmaptest
      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: jmaptest-logs
          path: test/interop/logs/
          if-no-files-found: warn
          retention-days: 14

  binaries:
    name: binaries (linux/darwin x amd64/arm64)
    # Only build artefacts for non-PR events: push to main and manual
    # dispatches. PR CI runs are gated for correctness by the test and
    # web jobs above; cross-compiling every PR commit doubles runner
    # load with no consumer.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, netzhansa, amd64]
    timeout-minutes: 30
    needs: [lint, web, test]
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Build the suite + admin + manual artefacts once; the embedded
      # FS tree is byte-identical regardless of target platform. Only
      # the Go binary is platform-specific.
      - name: build-web
        run: ./scripts/build-web.sh
      - name: build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=true -ldflags "-s -w" \
            -o dist/herold-${{ matrix.os }}-${{ matrix.arch }} ./cmd/herold
          for p in plugins/herold-*; do
            [ -d "$p" ] || continue
            name=$(basename "$p")
            go build -trimpath -buildvcs=true -ldflags "-s -w" \
              -o dist/${name}-${{ matrix.os }}-${{ matrix.arch }} ./$p
          done
      - uses: actions/upload-artifact@v3
        with:
          name: herold-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 30

  # Deploy to outpost.netzhansa.com via the release-pull framework.
  #
  # The activate script on the host fetches a Forgejo release by tag and
  # downloads exactly two assets: herold-<ref>.tar.gz and
  # herold-<ref>.sha256.  It verifies the checksum, extracts the tarball
  # (which must contain only `herold` at the archive root, mode 0755),
  # swaps current -> releases/<ref>, and restarts the herold systemd unit.
  #
  # NOTE: ci-<sha> release tags accumulate in this repo indefinitely.
  # The host-side activate script already prunes release dirs (KEEP=5),
  # but the Forgejo release objects and their asset binaries are not
  # pruned.  A scheduled Forgejo-side retention sweep is a follow-up task.
  deploy:
    name: deploy (outpost.netzhansa.com)
    # The release-pull deploy runs on any standard orchestrator-provisioned
    # runner (it publishes a release and SSH-triggers `activate` on outpost
    # -- it does not run on outpost itself). The `herold` label advertised by
    # no runner left this job perpetually unschedulable and cancelled; use the
    # same `netzhansa` pool every other job (and html-scrabble's deploy) uses.
    runs-on: [self-hosted, netzhansa, amd64]
    needs: [test, binaries]
    # Only deploy on pushes to the default branch, never on PRs or tags.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      # Guard: if DEPLOY_SSH_KEY is not configured, skip remaining steps
      # rather than failing.  Forgejo/Actions does not permit secrets.*
      # in a job-level `if` condition, so we use a step-output gate
      # instead.  This makes the job a safe no-op until the operator
      # configures the required secrets (see runbook below).
      - name: check secrets configured
        id: guard
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "DEPLOY_SSH_KEY is not set; skipping deploy"
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          fi

      # Download the linux/amd64 binary produced by the binaries job.
      # Artifact name is herold-linux-amd64; it contains the file
      # dist/herold-linux-amd64 (and any co-built plugin binaries).
      - name: download linux/amd64 binary
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/download-artifact@v3
        with:
          name: herold-linux-amd64
          path: downloaded/

      - name: package release assets
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          REF="ci-${GITHUB_SHA::10}"
          echo "REF=${REF}" >> "${GITHUB_ENV}"

          # Lay out a bare `herold` binary at the archive root so that
          # `tar -C releases/<ref> -xzf herold-<ref>.tar.gz` produces
          # releases/<ref>/herold directly (no subdirectory).
          install -m 0755 downloaded/herold-linux-amd64 herold

          tar -czf "herold-${REF}.tar.gz" herold
          sha256sum "herold-${REF}.tar.gz" > "herold-${REF}.sha256"

          echo "Packaged herold-${REF}.tar.gz"
          cat "herold-${REF}.sha256"

      - name: create Forgejo release and upload assets
        if: steps.guard.outputs.enabled == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          API="${GITHUB_SERVER_URL}/api/v1"
          REPO="herold/herold"
          AUTH="Authorization: token ${RELEASE_TOKEN}"

          # Idempotent: drop any pre-existing release + tag for this ref so a
          # re-run of the same commit recreates cleanly instead of 409ing on
          # the duplicate tag.
          existing=$(curl -fsS -H "${AUTH}" \
            "${API}/repos/${REPO}/releases/tags/${REF}" 2>/dev/null \
            | jq -r '.id // empty' || true)
          if [ -n "${existing}" ]; then
            echo "removing existing release ${REF} (id ${existing})"
            curl -fsS -X DELETE -H "${AUTH}" "${API}/repos/${REPO}/releases/${existing}" || true
          fi
          curl -fsS -X DELETE -H "${AUTH}" "${API}/repos/${REPO}/tags/${REF}" >/dev/null 2>&1 || true

          # Create a pre-release tagged at the pushed commit. Parse the id
          # with jq: the previous sed pattern greedily matched the LAST "id"
          # in the single-line JSON -- the nested author.id (=1) -- so every
          # asset upload 404'd against releases/1. jq -r '.id' takes the
          # top-level release id.
          RELEASE_ID=$(curl -fsSL -X POST "${API}/repos/${REPO}/releases" \
            -H "${AUTH}" -H "Content-Type: application/json" \
            -d "$(jq -nc --arg t "${REF}" --arg c "${GITHUB_SHA}" \
                  '{tag_name:$t, target_commitish:$c, name:$t, prerelease:true, draft:false}')" \
            | jq -r '.id')

          if [ -z "${RELEASE_ID}" ] || [ "${RELEASE_ID}" = "null" ]; then
            echo "ERROR: failed to create release; no id returned" >&2
            exit 1
          fi
          echo "Created release id=${RELEASE_ID} tag=${REF}"

          # Upload tarball asset.
          curl -fsSL \
            -X POST "${API}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=herold-${REF}.tar.gz" \
            -H "${AUTH}" \
            -F "attachment=@herold-${REF}.tar.gz" > /dev/null

          # Upload checksum asset.
          curl -fsSL \
            -X POST "${API}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=herold-${REF}.sha256" \
            -H "${AUTH}" \
            -F "attachment=@herold-${REF}.sha256" > /dev/null

          echo "Uploaded herold-${REF}.tar.gz and herold-${REF}.sha256 to release ${RELEASE_ID}"

      - name: write SSH key
        if: steps.guard.outputs.enabled == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          KEY_FILE="$(mktemp)"
          chmod 0600 "${KEY_FILE}"
          # Trailing newline is required: OpenSSH refuses a private key whose
          # final line is not newline-terminated with "error in libcrypto".
          # printf '%s' drops it; printf '%s\n' restores it (matches the
          # proven html-scrabble deploy).
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${KEY_FILE}"
          echo "KEY_FILE=${KEY_FILE}" >> "${GITHUB_ENV}"

      - name: trigger host activation
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          ssh \
            -i "${KEY_FILE}" \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "deploy ${REF}"

      - name: remove SSH key
        if: always() && steps.guard.outputs.enabled == 'true'
        run: |
          if [ -n "${KEY_FILE:-}" ] && [ -f "${KEY_FILE}" ]; then
            rm -f "${KEY_FILE}"
          fi
