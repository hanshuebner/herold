name: nightly

on:
  schedule:
    # 22:15 UTC: gives fuzz-long (6h budget) and load (3h budget) a
    # clear lane through the night.
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.6"

jobs:
  # Gate: skip the heavy nightly jobs when nothing has been pushed since
  # the previous run. The schedule fires once a day, so "no commits in the
  # last ~24h" means last night's run already covered the current HEAD and
  # re-running would just burn a runner VM for the same result. A manual
  # workflow_dispatch always runs. checkout's default shallow clone is
  # enough: we only read HEAD's commit timestamp.
  gate:
    name: gate (commits since last run)
    runs-on: [self-hosted, netzhansa, amd64]
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch -- running nightly"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age=$(( now - last ))
          # 24h plus a 1h grace for scheduler jitter, so a commit landing
          # just after last night's run is never falsely skipped.
          if [ "${age}" -gt 90000 ]; then
            echo "HEAD is ${age}s old (no commits in the last ~24h) -- skipping nightly"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "HEAD is ${age}s old -- running nightly"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  fuzz-long:
    name: fuzz (long)
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: [self-hosted, netzhansa, amd64]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # make fuzz-short runs EVERY registered fuzz target sequentially
      # for FUZZTIME each. There are ~39 targets, so 39 * 5m = ~195m of
      # work. FUZZTIME is sized so the pass reaches every target: the
      # run is cancelled at the ceiling with no partial credit, and the
      # targets it never got to are the ones that go unfuzzed, so
      # finishing inside the budget buys more coverage than a longer
      # per-target budget does. That budget must fit under THREE
      # independent ceilings, the smallest of which wins:
      #   - this job's timeout-minutes (360m / 6h, below);
      #   - the runner's act_runner per-job timeout (6h, set in the
      #     orchestrator cloud-init);
      #   - Forgejo's server-side ENDLESS_TASK_TIMEOUT, which DEFAULTS TO
      #     3h and silently force-stops any longer task regardless of the
      #     two above. That default killed this job at ~3h every single
      #     night (runs #118, #135, and every prior fuzz-long task) -- it
      #     never once finished. Raised to 7h in the Forgejo app.ini
      #     (netzhansa-infra roles/forgejo) so the 6h caps are the real
      #     limit and the ~195m run completes.
      # Each target's fuzzer already saturates the VM's cores, so raising
      # FUZZTIME costs runner hours proportionally. If the target count
      # grows past the budget, lower FUZZTIME again.
      - name: run long fuzz on every registered fuzz target
        run: make fuzz-short FUZZTIME=5m

  load:
    name: load (REQ-NFR-01 targets)
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: [self-hosted, netzhansa, amd64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: run load scenarios
        run: |
          if [ -d test/load ]; then go test -count=1 -timeout=2h ./test/load/...; else
            echo "test/load not yet populated"; fi

  interop:
    name: interop (third-party deliverability canary)
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: [self-hosted, netzhansa, amd64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: run interop canary
        run: |
          if [ -d test/interop-external ]; then go test -count=1 ./test/interop-external/...; else
            echo "test/interop-external not yet populated"; fi

  jmaptest-pin-check:
    name: jmaptest pin freshness
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: [self-hosted, netzhansa, amd64]
    timeout-minutes: 5
    # Fails when JMAPTEST_SHA in test/interop/config/jmaptest/Dockerfile
    # is no longer the upstream master HEAD of jmapio/jmap-test-suite.
    steps:
      - uses: actions/checkout@v4
      - name: compare pinned SHA against upstream master
        run: |
          set -euo pipefail
          DOCKERFILE=test/interop/config/jmaptest/Dockerfile
          PINNED=$(grep -E '^ARG JMAPTEST_SHA=' "${DOCKERFILE}" \
                   | head -1 \
                   | sed -E 's/^ARG JMAPTEST_SHA=([0-9a-f]+).*/\1/')
          if [ -z "${PINNED}" ]; then
            echo "ERROR: could not parse JMAPTEST_SHA from ${DOCKERFILE}"
            exit 2
          fi
          UPSTREAM=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/jmapio/jmap-test-suite/commits/master \
              | sed -nE 's/^[[:space:]]*"sha":[[:space:]]*"([0-9a-f]+)".*/\1/p' \
              | head -1)
          if [ -z "${UPSTREAM}" ]; then
            echo "ERROR: could not fetch upstream master SHA"
            exit 2
          fi
          echo "pinned SHA:   ${PINNED}"
          echo "upstream SHA: ${UPSTREAM}"
          if [ "${PINNED}" != "${UPSTREAM}" ]; then
            echo ""
            echo "FAIL: jmap-test-suite pin is stale."
            echo "Update JMAPTEST_SHA in ${DOCKERFILE} to ${UPSTREAM}"
            echo "and re-run the suite (make interop-jmaptest) to pick up"
            echo "any new conformance tests."
            exit 1
          fi
          echo "OK: pin matches upstream master."

  sbom-diff:
    name: sbom diff
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: [self-hosted, netzhansa, amd64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          # sbom-action auto-uploads the SBOM via the GitHub v4 artifact
          # API (@actions/artifact v2), which Forgejo does not implement
          # ("GHESNotSupportedError: upload-artifact@v4+ ... not supported
          # on GHES") and which failed this job every run. Disable the
          # built-in upload; the explicit upload-artifact@v3 step below
          # uses the older protocol Forgejo does support.
          upload-artifact: false
      - name: upload
        uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 3
