name: clear waiting-for-feedback on comment

# Drop the `waiting-for-feedback` label from an issue when a reply arrives that
# post-dates the label, so the label always reflects an outstanding question.
#
# The label is added together with an accompanying comment (the feedback
# request). That comment must not clear the label it was posted alongside, so a
# comment is only treated as a reply once it is more than GRACE seconds newer
# than the moment the label was last added.
on:
  issue_comment:
    types: [created]

jobs:
  unlabel:
    # Only issues carry this label; issue_comment also fires for PRs, which
    # have a `pull_request` member on the issue payload.
    if: ${{ !github.event.issue.pull_request }}
    runs-on: [self-hosted, netzhansa, amd64]
    permissions:
      issues: write
    steps:
      - name: remove waiting-for-feedback if reply post-dates the label
        env:
          TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          COMMENT_AT: ${{ github.event.comment.created_at }}
        run: |
          set -euo pipefail
          API="${GITHUB_SERVER_URL}/api/v1"
          REPO="herold/herold"
          LABEL="waiting-for-feedback"
          GRACE=120   # seconds a comment must trail the label-add to count as a reply
          AUTH="Authorization: token ${TOKEN}"

          # Fast path: nothing to do unless the label is currently set.
          present=$(curl -fsS -H "${AUTH}" \
            "${API}/repos/${REPO}/issues/${NUM}/labels" \
            | jq -r --arg l "${LABEL}" 'any(.[]; .name == $l)')
          if [ "${present}" != "true" ]; then
            echo "${LABEL} not set on #${NUM}; nothing to do"
            exit 0
          fi

          # Find when the label was most recently added. Timeline label events
          # carry body "1" for an add and ""/null for a remove; pages are
          # chronological, so the last page with a match holds the latest add.
          added_at=""
          page=1
          while :; do
            batch=$(curl -fsS -H "${AUTH}" \
              "${API}/repos/${REPO}/issues/${NUM}/timeline?limit=50&page=${page}")
            n=$(echo "${batch}" | jq 'length')
            [ "${n}" -eq 0 ] && break
            latest=$(echo "${batch}" | jq -r --arg l "${LABEL}" '
              map(select(.type == "label" and .label.name == $l and .body == "1"))
              | (max_by(.created_at).created_at) // empty')
            [ -n "${latest}" ] && added_at="${latest}"
            [ "${n}" -lt 50 ] && break
            page=$((page + 1))
          done
          if [ -z "${added_at}" ]; then
            echo "no add event found for ${LABEL} on #${NUM}; leaving as-is"
            exit 0
          fi

          added_epoch=$(date -d "${added_at}" +%s)
          comment_epoch=$(date -d "${COMMENT_AT}" +%s)
          delta=$((comment_epoch - added_epoch))
          if [ "${delta}" -lt "${GRACE}" ]; then
            echo "comment is ${delta}s after label-add (< ${GRACE}s grace); keeping ${LABEL} on #${NUM}"
            exit 0
          fi

          curl -fsS -X DELETE -H "${AUTH}" \
            "${API}/repos/${REPO}/issues/${NUM}/labels/${LABEL}"
          echo "cleared ${LABEL} on #${NUM} (reply ${delta}s after add)"
