name: deploy

# SSH-triggers outpost.netzhansa.com to pull + activate the newest
# published ci-<sha> release (docs/ci-driven-deploy.md in
# netzhansa-infra). Split out of ci.yml (re #323): ci.yml's own
# concurrency group (ci-${{ github.ref }}, cancel-in-progress: true)
# cancels a superseded run's `release` job along with its test lanes, so
# a busy queue of pushes to main could cancel every run before it
# reached deploy and starve outpost of a deploy for hours. This workflow
# sits in its own concurrency group that is never cancelled, so it always
# runs to completion once started.
#
# Trigger: this Forgejo instance (code.netzhansa.com, Forgejo 15.0.3) has
# no `workflow_run` trigger -- verified against its own source
# (modules/actions/github.go's GithubEvent* constants list `push`,
# `release`, `schedule`, `workflow_dispatch`, and others, but no
# `workflow_run`). ci.yml's `release` job publishes a non-draft Forgejo
# release via the API once every build/lint/test/conformance job has
# passed; a non-draft release create fires the `release` event with
# action "published" (services/release.CreateRelease ->
# notify_service.NewRelease, confirmed in the same source tree), which
# is the closest available substitute for "on ci success": it fires
# once per successfully-published release, never for a failing or
# superseded run, with no polling needed. `schedule` (every 30 minutes)
# is a backstop for a missed or failed run of this workflow itself.
#
# Because ci.yml's `release` job already gates publication on every
# test/lint/build job, "the newest ci-<sha> release" IS "the newest
# commit whose ci run succeeded" -- this job does not need to inspect
# ci.yml's run status separately.
#
# Caveat: the release object is created non-draft (so the `published`
# event has something to fire), and its two assets are uploaded in
# separate API calls afterward, so `published` can fire before, or
# without, the assets existing (e.g. the `release` job's own run gets
# cancelled by a newer push between the two). Forgejo's release-edit
# path (draft -> non-draft) does not help here: it fires the `release`
# event with action "edited", not "published" (services/release.go's
# UpdateRelease only calls notify_service.NewRelease when the tag is
# newly created in that same call), so a create-as-draft-then-publish
# flow would need `types: [published, edited]` and gains nothing --
# this workflow instead tolerates an asset-less release directly: the
# "find newest complete ci- release" step below skips any release
# missing either asset and falls back to the next-newest complete one.
on:
  release:
    types: [published]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-outpost
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy (outpost.netzhansa.com)
    runs-on: [self-hosted, netzhansa, amd64]
    timeout-minutes: 15
    steps:
      # Guard: if DEPLOY_SSH_KEY or RELEASE_TOKEN is not configured, skip
      # remaining steps rather than failing. Forgejo/Actions does not
      # permit secrets.* in a job-level `if` condition, so we use a
      # step-output gate instead. This makes the job a safe no-op until
      # the operator configures the required secrets.
      - name: check secrets configured
        id: guard
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "${DEPLOY_SSH_KEY}" ] || [ -z "${RELEASE_TOKEN}" ]; then
            echo "DEPLOY_SSH_KEY or RELEASE_TOKEN is not set; skipping deploy"
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          fi

      # Needed for scripts/deploy-decide.sh (the decision logic below) and
      # for a full history to check with -- the ordering guard walks
      # ancestry between the target release's commit and whatever commit
      # is currently live, which can be arbitrarily far back if outpost
      # has gone a while between deploys, so this is a full clone, not a
      # shallow one.
      - name: checkout
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Find the newest ci-<sha> release that has both expected assets
      # (herold-<ref>.tar.gz, herold-<ref>.sha256) present -- see the
      # header comment on why a release can transiently or permanently
      # lack them. Also resolves the release's target_commitish, which
      # scripts/deploy-decide.sh needs for the ordering guard.
      - name: find newest complete ci- release
        id: target
        if: steps.guard.outputs.enabled == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          API="${GITHUB_SERVER_URL}/api/v1"
          REPO="herold/herold"
          AUTH="Authorization: token ${RELEASE_TOKEN}"

          releases=$(curl -fsS -H "${AUTH}" "${API}/repos/${REPO}/releases?limit=50")
          refs=$(printf '%s' "${releases}" \
            | jq -r '[.[] | select(.tag_name|startswith("ci-"))] | sort_by(.created_at) | reverse | .[].tag_name')

          if [ -z "${refs}" ]; then
            echo "no ci- release published yet; nothing to deploy"
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          found=""
          for ref in ${refs}; do
            assets=$(printf '%s' "${releases}" | jq -r --arg t "${ref}" '.[] | select(.tag_name==$t) | .assets[].name')
            if printf '%s\n' "${assets}" | grep -qx "herold-${ref}.tar.gz" \
               && printf '%s\n' "${assets}" | grep -qx "herold-${ref}.sha256"; then
              found="${ref}"
              break
            fi
            echo "skipping ${ref}: assets not (yet) complete"
          done

          if [ -z "${found}" ]; then
            echo "no complete ci- release found; nothing to deploy"
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          sha=$(printf '%s' "${releases}" | jq -r --arg t "${found}" '.[] | select(.tag_name==$t) | .target_commitish')
          if [ -z "${sha}" ] || [ "${sha}" = "null" ]; then
            echo "ERROR: release ${found} has no target_commitish" >&2
            exit 1
          fi

          echo "target release: ${found} (${sha})"
          echo "found=true" >> "${GITHUB_OUTPUT}"
          echo "ref=${found}" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: write SSH key
        if: steps.guard.outputs.enabled == 'true' && steps.target.outputs.found == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          KEY_FILE="$(mktemp)"
          chmod 0600 "${KEY_FILE}"
          # Trailing newline is required: OpenSSH refuses a private key whose
          # final line is not newline-terminated with "error in libcrypto".
          # printf '%s' drops it; printf '%s\n' restores it (matches the
          # proven html-scrabble deploy).
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${KEY_FILE}"
          echo "KEY_FILE=${KEY_FILE}" >> "${GITHUB_ENV}"

      # `status` is a read-only forced command (netzhansa-infra
      # roles/deploy/files/trigger + activate): on exit 0 it prints
      # either the basename of outpost's `current` release symlink, or
      # the sentinel "none" when nothing is live yet. Any other outcome
      # (nonzero exit, empty stdout) means the answer is unreadable --
      # captured exactly as observed, with no collapsing into "" here.
      # scripts/deploy-decide.sh is the only place that interprets it,
      # and it fails closed on anything but those two readable shapes.
      - name: check outpost's currently active release
        id: current
        if: steps.guard.outputs.enabled == 'true' && steps.target.outputs.found == 'true'
        run: |
          set -uo pipefail
          if output=$(ssh \
            -i "${KEY_FILE}" \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "status"); then
            rc=0
          else
            rc=$?
          fi
          echo "status query: exit=${rc} output=${output:-<empty>}"
          {
            echo "exit_code=${rc}"
            echo "output=${output}"
          } >> "${GITHUB_OUTPUT}"

      # Resolve the live release's commit for the ordering guard, when
      # outpost reported a named release that isn't already the target
      # (nothing to resolve for "none", and an exact ref match skips
      # without needing ancestry at all -- deploy-decide.sh handles both
      # without this step's output).
      - name: resolve currently active release's commit
        id: current_sha
        if: >-
          steps.guard.outputs.enabled == 'true' && steps.target.outputs.found == 'true' &&
          steps.current.outputs.exit_code == '0' &&
          steps.current.outputs.output != '' && steps.current.outputs.output != 'none' &&
          steps.current.outputs.output != steps.target.outputs.ref
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -uo pipefail
          API="${GITHUB_SERVER_URL}/api/v1"
          REPO="herold/herold"
          AUTH="Authorization: token ${RELEASE_TOKEN}"
          ref="${{ steps.current.outputs.output }}"

          sha=$(curl -fsS -H "${AUTH}" "${API}/repos/${REPO}/releases/tags/${ref}" | jq -r '.target_commitish // empty')
          echo "live release ${ref} resolves to commit: ${sha:-<unresolved>}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: decide
        id: decide
        if: steps.guard.outputs.enabled == 'true' && steps.target.outputs.found == 'true'
        run: |
          set -euo pipefail
          decision=$(./scripts/deploy-decide.sh \
            "${{ steps.current.outputs.exit_code }}" \
            "${{ steps.current.outputs.output }}" \
            "${{ steps.target.outputs.ref }}" \
            "${{ steps.target.outputs.sha }}" \
            "${{ steps.current_sha.outputs.sha }}" \
            "${{ github.workspace }}")
          echo "decision: ${decision}"
          echo "decision=${decision}" >> "${GITHUB_OUTPUT}"
          if [ "${decision}" = "fail" ]; then
            exit 1
          fi

      - name: trigger host activation
        if: steps.guard.outputs.enabled == 'true' && steps.target.outputs.found == 'true' && steps.decide.outputs.decision == 'deploy'
        run: |
          set -euo pipefail
          ssh \
            -i "${KEY_FILE}" \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "deploy ${{ steps.target.outputs.ref }}"

      # Verifies the deployed release on outpost matches the commit this
      # run intended to deploy, rather than trusting the SSH command's
      # exit status alone. A deploy whose result cannot be confirmed is
      # not a success, so this fails the job on either an unreadable
      # status query or a confirmed mismatch -- it does not warn-and-pass.
      #
      # `cur=$(...)` bare would abort the whole step on a failing ssh
      # command before `rc=$?` is ever reached: Forgejo/GitHub Actions
      # runs each `run:` block as `bash -e ...`, and that -e is already
      # active before this script's own `set` line runs, so it applies
      # to the command substitution regardless. `if cur=$(...); then ...
      # else ...; fi` is the idiom that survives that: a failing command
      # inside an `if` condition does not trigger -e.
      - name: verify the deployed release matches the target
        if: steps.guard.outputs.enabled == 'true' && steps.target.outputs.found == 'true' && steps.decide.outputs.decision == 'deploy'
        run: |
          set -uo pipefail
          if cur=$(ssh \
            -i "${KEY_FILE}" \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "status"); then
            rc=0
          else
            rc=$?
          fi
          if [ "${rc}" -ne 0 ] || [ -z "${cur}" ]; then
            echo "ERROR: could not confirm outpost's status after deploying (exit ${rc}); a deploy that cannot be confirmed is not a success" >&2
            exit 1
          fi
          echo "outpost now runs: ${cur}"
          if [ "${cur}" != "${{ steps.target.outputs.ref }}" ]; then
            echo "ERROR: outpost runs ${cur}, expected ${{ steps.target.outputs.ref }}" >&2
            exit 1
          fi
          echo "confirmed: outpost runs ${{ steps.target.outputs.ref }}"

      - name: remove SSH key
        if: always() && steps.guard.outputs.enabled == 'true' && steps.target.outputs.found == 'true'
        run: |
          if [ -n "${KEY_FILE:-}" ] && [ -f "${KEY_FILE}" ]; then
            rm -f "${KEY_FILE}"
          fi
